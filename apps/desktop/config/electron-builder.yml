# Her own app bundle, so she can be kept in the Dock and used while the
# checkout is being worked on. Personal build for now: ad-hoc signed (see the
# `package` script), no dmg, no notarization — those belong to handing her to
# someone else.
appId: dev.claudecafe.client
productName: ClaudeCafe
copyright: Claude Café

directories:
  output: release
  buildResources: assets

files:
  - dist/**            # the window itself, built by vite
  - dist-electron/**   # the main process, the preload, and shared prompt text
  - package.json
  # The window runs on the master's own Claude Code (electron/session/claude.ts), so
  # the SDK's platform packages and the executable in them stay behind.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*{,/**}'

# Keep the SDK and prompt resources as plain files, matching the dev build.
asar: false

mac:
  category: public.app-category.developer-tools
  icon: assets/app-icon.png
  target:
    - target: dir
      arch: arm64
  # No Developer ID yet: the bundle is signed ad-hoc afterwards, which is all
  # macOS asks of an app that was never downloaded.
  identity: null
